Executable: AnalyticTestCharacteristicExtract
Testing:
  Check: parse;execute_check_output
  Timeout: 20
  Priority: High
ExpectedOutput:
  - CharacteristicExtractReduction.h5
OutputFileChecks:
  - Label: "check_news"
    Subfile: "/SpectreR0030.cce/News"
    FileGlob: "CharacteristicExtractReduction.h5"
    ExpectedDataSubfile: "/Cce/News_expected.dat"
    AbsoluteTolerance: 5e-5

---

Evolution:
  InitialTimeStep: 0.01
  MinimumTimeStep: 1e-7
  InitialSlabSize: 0.8

ResourceInfo:
  AvoidGlobalProc0: false
  Singletons: Auto

Observers:
  VolumeFileName: "CharacteristicExtractUnusedVolume"
  ReductionFileName: "CharacteristicExtractReduction"

EventsAndTriggersAtSlabs:
  - Trigger:
      Slabs:
        EvenlySpaced:
          Offset: 0
          Interval: 1
    Events:
      - ObserveTimeStep:
          SubfileName: CceTimeStep
          PrintTimeToTerminal: true

EventsAndTriggersAtSteps:

Cce:
  Evolution:
    TimeStepper:
      AdamsBashforth:
        Order: 3 # Going to higher order doesn't seem necessary for CCE
    StepChoosers:
      - Constant: 0.1 # Don't take steps bigger than 0.1M
      - LimitIncrease:
          Factor: 2
      - ErrorControl(SwshVars):
          AbsoluteTolerance: 1e-8
          RelativeTolerance: 1e-6
          # These factors control how much the time step is changed at once.
          MaxFactor: 2
          MinFactor: 0.25
          # How close to the "perfect" time step we take. Since the "perfect"
          # value assumes a linear system, we need some safety factor since our
          # system is nonlinear, and also so that we reduce how often we retake
          # time steps.
          SafetyFactor: 0.9
      - ErrorControl(CoordVars):
          AbsoluteTolerance: 1e-8
          RelativeTolerance: 1e-7
          # These factors control how much the time step is changed at once.
          MaxFactor: 2
          MinFactor: 0.25
          # How close to the "perfect" time step we take. Since the "perfect"
          # value assumes a linear system, we need some safety factor since our
          # system is nonlinear, and also so that we reduce how often we retake
          # time steps.
          SafetyFactor: 0.9

  LMax: 12
  NumberOfRadialPoints: 12
  ObservationLMax: 4

  StartTime: -1000.0
  EndTime: -960.0
  ExtractionRadius: &radius 30.0

  AnalyticSolution:
    BouncingBlackHole:
      Period: &period 40.0
      ExtractionRadius: *radius
      Mass: 1.0
      Amplitude: &amp 0.0 

  Filtering:
    RadialFilterHalfPower: 24
    RadialFilterAlpha: 35.0
    FilterLMax: 10

  ScriInterpOrder: 3
  ScriOutputDensity: 1
